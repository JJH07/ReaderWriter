name: Linux build and integration tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            sanitize: false
          - compiler: clang
            sanitize: false
          - compiler: gcc
            sanitize: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build from the original three files
        run: |
          test -x /usr/bin/vim
          if [ '${{ matrix.sanitize }}' = 'true' ]; then
            make CC=${{ matrix.compiler }} CFLAGS='-O1 -g -std=c11 -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie' LDFLAGS='-fsanitize=address,undefined -no-pie'
          else
            make CC=${{ matrix.compiler }}
          fi
      - name: Original interface and regression tests
        run: python3 -m unittest discover -s tests -v
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
